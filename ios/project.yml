# XcodeGen の定義。
#
# .xcodeproj は生成物として gitignore している。project.pbxproj は実質マージ不能な
# テキストで、複数ブランチで触ると必ず衝突するため。構成の変更はこの YAML の差分として
# レビューする（プラン §7.1）。
name: CharaTime

options:
  bundleIdPrefix: app.charatime
  deploymentTarget:
    # 実機は iPhone 17 Pro / iOS 26.1。Phase 3 まで iOS 26 に据え置く（プラン D-15）。
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    # 決定論を守るため、並行性の取りこぼしはコンパイル時に落としておきたい。
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ${CHARATIME_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

# **iPhone だけを対象にする。**
#
# XcodeGen は各ターゲットに TARGETED_DEVICE_FAMILY = "1,2"（iPhone と iPad）を
# 既定で書き込み、それが settings.base（プロジェクト全体）を上書きする。だから
# ここで束ねて、ターゲット側から名乗り直す。
#
# iPad を名乗ると「全向きに対応せよ」と要求され、待受モードの縦向き固定と矛盾して
# 実機ビルドが警告を出す。透過ウィジェットの切り抜き座標も Dynamic Island も
# StandBy も iPhone 前提なので（プラン §4.4）、名乗りのほうを実態に合わせる。
settingGroups:
  iPhoneOnly:
    TARGETED_DEVICE_FAMILY: "1"

packages:
  CTCore:
    path: Packages/CTCore
  CTAssets:
    path: Packages/CTAssets
  CTRender:
    path: Packages/CTRender
  CTStore:
    path: Packages/CTStore

targets:

  CharaTime:
    type: application
    platform: iOS
    sources:
      - path: CharaTime
      # 疑似アニメのマスク書体（tools/pipeline が焼く）と、書体の確認。ウィジェットの下見と設定画面で使う。
      - path: Shared/Fonts
      - path: Shared/Sources
    dependencies:
      - package: CTCore
      - package: CTAssets
      - package: CTRender
      - package: CTStore
      - target: CharaTimeWidgetExtension
    settings:
      groups: [iPhoneOnly]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.charatime
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: CharaTime/Info.plist
      properties:
        CFBundleDisplayName: CharaTime
        # 画面はすべて日本語。宣言しないと OS が出す文言が英語のままになる。
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 疑似アニメのマスク書体（ウィジェット拡張と同じ 7 本。並びは tools/pipeline/masks.py と同じ）。
        # アプリにも登録するのは、ウィジェットの下見の画面で同じ動きを見せるため。
        UIAppFonts:
          - CTMask05.ttf
          - CTMask036.ttf
          - CTMask02468.ttf
          - CTMask0156.ttf
          - CTMask012567.ttf
          - CTMask0.ttf
          - CTMask012.ttf
        # 待受モードは画面を点けたままにする。表示中だけ true に切り替える
        # （プラン §4.4）ので、ここでは既定のままにしておく。
    entitlements:
      path: CharaTime/CharaTime.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.charatime

  CharaTimeWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: CharaTimeWidget
      - path: Shared/Fonts
      - path: Shared/Sources
    dependencies:
      - package: CTCore
      - package: CTAssets
      - package: CTRender
      - package: CTStore
    settings:
      groups: [iPhoneOnly]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.charatime.widget
        # 拡張は約 30 MB のメモリ上限で動く。重い依存を足すときはここを思い出す
        # （プラン §7.3）。
    info:
      path: CharaTimeWidget/Info.plist
      properties:
        CFBundleDisplayName: CharaTime
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja]
        # 疑似アニメのマスク書体（tools/pipeline/masks.py が焼く 7 本）。**拡張の UIAppFonts で登録する。**
        # 実行時に登録した書体を、OS のタイマーの描き直しが使うかは確かめていない（この形で動くことは
        # Phase 0 のスパイクと 3-2b の本番で確かめた）。
        UIAppFonts:
          - CTMask05.ttf
          - CTMask036.ttf
          - CTMask02468.ttf
          - CTMask0156.ttf
          - CTMask012567.ttf
          - CTMask0.ttf
          - CTMask012.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CharaTimeWidget/CharaTimeWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.charatime

  # シミュレータのホーム画面を操作するロボット（プラン §9 Phase 3 の 3-0d、Q-16）。
  #
  # **テストではなく道具。** テストメソッド 1 つが操作 1 つ（置く・外す・ページを出す）に当たり、
  # scripts/home-screen.sh が選んで呼ぶ。アプリにも CI にも入らない。
  #
  # 本体アプリを「試す相手」にしておくと、ロボットをビルドするときにアプリも一緒にビルドされる。
  # **テストを走らせてもアプリは入れ直されない**（xcodebuild は試す相手を起動するときだけ入れる。
  # ロボットは起動しない）。入れ直すのは scripts/home-screen.sh build の役目。
  HomeScreenRobot:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HomeScreenRobot
    dependencies:
      - target: CharaTime
    settings:
      groups: [iPhoneOnly]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.charatime.robot
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CharaTime:
    build:
      targets:
        CharaTime: all
        CharaTimeWidgetExtension: all
    run:
      config: Debug
  # ロボット専用。CharaTime のスキームに混ぜると、ふだんのビルドが UI テストの分だけ重くなる。
  HomeScreenRobot:
    build:
      targets:
        HomeScreenRobot: [test]
    test:
      config: Debug
      targets: [HomeScreenRobot]
