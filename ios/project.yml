# XcodeGen の定義。
#
# .xcodeproj は生成物として gitignore している。project.pbxproj は実質マージ不能な
# テキストで、複数ブランチで触ると必ず衝突するため。構成の変更はこの YAML の差分として
# レビューする（プラン §7.1）。
name: CharaTime

options:
  bundleIdPrefix: app.charatime
  deploymentTarget:
    # 実機は iPhone 17 Pro / iOS 26.1。Phase 3 まで iOS 26 に据え置く（プラン D-15）。
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    # 決定論を守るため、並行性の取りこぼしはコンパイル時に落としておきたい。
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ${CHARATIME_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

# **iPhone だけを対象にする。**
#
# XcodeGen は各ターゲットに TARGETED_DEVICE_FAMILY = "1,2"（iPhone と iPad）を
# 既定で書き込み、それが settings.base（プロジェクト全体）を上書きする。だから
# ここで束ねて、ターゲット側から名乗り直す。
#
# iPad を名乗ると「全向きに対応せよ」と要求され、待受モードの縦向き固定と矛盾して
# 実機ビルドが警告を出す。透過ウィジェットの切り抜き座標も Dynamic Island も
# StandBy も iPhone 前提なので（プラン §4.4）、名乗りのほうを実態に合わせる。
settingGroups:
  iPhoneOnly:
    TARGETED_DEVICE_FAMILY: "1"

packages:
  CTCore:
    path: Packages/CTCore
  CTAssets:
    path: Packages/CTAssets
  CTRender:
    path: Packages/CTRender
  CTStore:
    path: Packages/CTStore

targets:

  CharaTime:
    type: application
    platform: iOS
    sources:
      - path: CharaTime
      # スパイクの見た目だけ本体アプリでも描けるようにする。
      # **手元でマスクフォントが正しく効くかを先に確かめるため**で、
      # 実機での判定（拡張が止まっていても描き直されるか）はこれでは分からない。
      - path: CharaTimeSpikeWidget/Shared
      - path: CharaTimeSpikeWidget/Fonts
    dependencies:
      - package: CTCore
      - package: CTAssets
      - package: CTRender
      - package: CTStore
      - target: CharaTimeWidgetExtension
      # スパイクは判定が出たら丸ごと消す（プラン §9 Phase 0 の 0-9〜0-11）。
      - target: CharaTimeSpikeWidgetExtension
    settings:
      groups: [iPhoneOnly]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.charatime
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: CharaTime/Info.plist
      properties:
        CFBundleDisplayName: CharaTime
        # 画面はすべて日本語。宣言しないと OS が出す文言が英語のままになる。
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # スパイクの確認画面（`-CTScreen spike`）で使う。判定が出たら消す。
        UIAppFonts:
          - CTSpikeMaskEven.ttf
          - CTSpikeMaskOdd.ttf
        # 待受モードは画面を点けたままにする。表示中だけ true に切り替える
        # （プラン §4.4）ので、ここでは既定のままにしておく。
    entitlements:
      path: CharaTime/CharaTime.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.charatime

  CharaTimeWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: CharaTimeWidget
    dependencies:
      - package: CTCore
      - package: CTAssets
      - package: CTRender
      - package: CTStore
    settings:
      groups: [iPhoneOnly]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.charatime.widget
        # 拡張は約 30 MB のメモリ上限で動く。重い依存を足すときはここを思い出す
        # （プラン §7.3）。
    info:
      path: CharaTimeWidget/Info.plist
      properties:
        CFBundleDisplayName: CharaTime
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CharaTimeWidget/CharaTimeWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.charatime

  # ウィジェット疑似アニメの実機スパイク（プラン §9 Phase 0 の 0-9〜0-11、D-11）。
  #
  # **本番のウィジェット拡張とは別のターゲットにする。** 拡張はターゲットごとに
  # 別プロセスで動くので、非公式の手法を試して落ちても、本番のウィジェットは
  # 巻き添えにならない。判定が出たらこのターゲットごと消す。
  CharaTimeSpikeWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: CharaTimeSpikeWidget
    settings:
      groups: [iPhoneOnly]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.charatime.spike
    info:
      path: CharaTimeSpikeWidget/Info.plist
      properties:
        CFBundleDisplayName: CharaTime スパイク
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja]
        # マスクフォントを登録する。ウィジェット拡張の Info.plist で
        # UIAppFonts が効くかどうかも、このスパイクで確かめる点のひとつ。
        UIAppFonts:
          - CTSpikeMaskEven.ttf
          - CTSpikeMaskOdd.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  CharaTime:
    build:
      targets:
        CharaTime: all
        CharaTimeWidgetExtension: all
        CharaTimeSpikeWidgetExtension: all
    run:
      config: Debug
